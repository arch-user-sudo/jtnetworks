<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="112" fill="url(#glow)"/>
  <circle cx="128" cy="126" r="98" fill="url(#disc)" stroke="#404040" stroke-width="2"/>

  <!-- quiet orbit -->
  <circle cx="128" cy="126" r="72" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- network links -->
  <g stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="3"
     stroke-linecap="round">
    <line x1="128" y1="126" x2="128" y2="58"/>
    <line x1="128" y1="126" x2="70" y2="180"/>
    <line x1="128" y1="126" x2="186" y2="180"/>
  </g>

  <!-- outer nodes -->
  <circle cx="128" cy="58" r="11" fill="#FFFFFF"/>
  <circle cx="70" cy="180" r="11" fill="#FFFFFF"/>
  <circle cx="186" cy="180" r="11" fill="#66B366"/>

  <!-- hub -->
  <circle cx="128" cy="126" r="17" fill="#FFFFFF"/>
  <circle cx="128" cy="126" r="7" fill="#0A0B0C"/>
</svg>
